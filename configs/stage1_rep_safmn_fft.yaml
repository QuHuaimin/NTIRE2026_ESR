# SPANV2 Stage 1 REP ablation using SAFMN's default unnormalized FFT loss.
name: spanv2_stage1_rep_fd2k_safmn_fft_gb64
model_type: SRModel
scale: 4
num_gpu: 1
manual_seed: 10

datasets:
  train:
    name: DF2K
    type: ReportMultiShapePairedImageDataset
    dataroot_gt: ~/datasets/DF2K/HR
    dataroot_lq: ~/datasets/DF2K/LR/X4
    meta_info_file: ~/datasets/DF2K/meta_info_DF2K.txt
    filename_tmpl: '{}x4'
    io_backend:
      type: disk
    multi_shapes:
      - [256, 256]
      - [320, 320]
      - [384, 384]
      - [448, 448]
      - [512, 512]
      - [256, 384]
      - [384, 512]
      - [512, 384]
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 100
    persistent_workers: false
    prefetch_mode: ~

  val:
    name: DIV2K100
    type: PairedImageDataset
    dataroot_gt: ~/datasets/DIV2K/HR
    dataroot_lq: ~/datasets/DIV2K_bicubic/LR/X4
    meta_info_file: ~/datasets/DIV2K/meta_info_DIV2K_valid.txt
    filename_tmpl: '{}x4'
    io_backend:
      type: disk

network_g:
  type: SPANV2ESRRep
  num_in_ch: 3
  num_out_ch: 3
  feature_channels: 32
  upscale: 4
  bias: false
  use_span_attn: false

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  gradient_accumulation_steps: 8
  optim_g:
    type: AdamW
    lr: !!float 1e-3
    betas: [0.9, 0.99]
    weight_decay: !!float 1e-4
  scheduler:
    type: CosineAnnealingRestartLR
    periods: [1000000]
    restart_weights: [1]
    eta_min: !!float 1e-6
  total_iter: 1000000
  warmup_iter: -1
  gradient_diagnostics_interval: 1000
  pixel_opt:
    type: L1FFTReportLoss
    l1_weight: 1.0
    fft_weight: 0.05
    fft_norm: backward
    reduction: mean

val:
  val_freq: !!float 1e4
  save_img: false
  pbar: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 1e4
  wandb:
    project: SPANV2
    entity: ~
    group: fft_ablation
    tags: [stage1, rep, df2k, x4, global-batch-64, safmn-fft, backward]
    resume_id: ~
    resume_mode: resume

dist_params:
  backend: nccl
  port: 29500
